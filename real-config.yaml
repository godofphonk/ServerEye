server:
  name: "Production Server"
  description: "ServerEye monitored server"
  secret_key: "srv_af569f00"  # Реальный ключ от разработчика

api:
  base_url: "http://localhost:8080"
  api_key: "test_api_key"

websocket:
  enabled: true
  url: "ws://localhost:8080/ws"
  reconnect_interval: "5s"
  max_reconnect_attempts: 10
  ping_interval: "30s"

metrics:
  cpu_usage: true
  memory_usage: true
  disk_usage: true
  cpu_temperature: true
  interval: "30s"

logging:
  level: "info"
  file: "/tmp/servereye-test.log"

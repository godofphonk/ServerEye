server:
  name: "gospodin-A620M-Pro-RS"
  description: "ServerEye monitored server"
  secret_key: "key_ff259066-244e-46d7-911b-"

api:
  base_url: "https://api.servereye.dev"
  api_key: "sPnMkMxyxIcjq1kJD7FOtEjUrHxvSmEU"
  timeout: "30s"

websocket:
  enabled: true
  url: "wss://api.servereye.dev/ws"
  reconnect_interval: "5s"
  max_reconnect_attempts: 10
  ping_interval: "30s"
  write_timeout: "10s"
  read_timeout: "10s"
  handshake_timeout: "10s"
  buffer_size: 1000
  enable_compression: true
  metric_buffer_size: 100
  metric_buffer_flush: "30s"
  command_queue_size: 100
  command_timeout: "30s"

metrics:
  cpu_usage: false
  memory_usage: true
  disk_usage: false
  cpu_temperature: true
  interval: "30s"

logging:
  level: "info"
  file: "/var/log/servereye/agent.log"

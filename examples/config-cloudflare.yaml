# ServerEye Agent Configuration for Cloudflare Tunnel Deployment
# Production configuration with HTTP API endpoints

# Server identification
server:
  name: "prod-server-001"
  secret_key: "srv_91a1a72ea96869c28b595996a8c47e09"
  
# HTTP API Configuration (Primary)
api:
  base_url: "https://metrics.servereye.dev"
  api_key: "prod-api-key-2024-change-me"
  timeout: "30"
  
# Kafka Configuration (Disabled - using HTTP API)
kafka:
  enabled: false
  brokers: []
  topic_prefix: "metrics"
  
# Metrics collection
metrics:
  interval: "30s"  # seconds
  cpu_usage: true
  memory_usage: true
  disk_usage: true
  cpu_temperature: true
  
# Logging
logging:
  level: "info"
  file: "/var/log/servereye/agent.log"

# ServerEye Agent Configuration - Windows

server:
  name: "Windows-PC"  # Change to your computer name
  description: "ServerEye monitored Windows machine"
  secret_key: "srv_windows_test_key_123456789012"  # Generate your own

api:
  base_url: "https://servereye-registration-worker.servereye.workers.dev"
  timeout: "30s"

websocket:
  enabled: true
  url: "wss://servereye-registration-worker.servereye.workers.dev/ws"
  reconnect_interval: "5s"
  max_reconnect_attempts: 10
  ping_interval: "30s"
  write_timeout: "10s"
  read_timeout: "10s"

metrics:
  cpu_usage: false      # Disabled for now (Linux only)
  memory_usage: true    # Works via Go runtime
  disk_usage: false     # Disabled for now (Linux only)
  cpu_temperature: false # Disabled for now (Linux only)
  interval: "30s"

logging:
  level: "info"
  file: "C:\\ProgramData\\ServerEye\\agent.log"

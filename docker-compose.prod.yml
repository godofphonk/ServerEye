version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: servereye-postgres-prod
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: servereye
      POSTGRES_USER: servereye
      POSTGRES_PASSWORD: teec301210600644
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - servereye-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servereye"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servereye-backend-prod
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://servereye:teec301210600644@postgres:5432/servereye
      API_KEY: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - servereye-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  servereye-network:
    driver: bridge

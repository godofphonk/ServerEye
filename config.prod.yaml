server:
  name: "Production Server"
  description: "ServerEye monitored server"
  secret_key: "your_production_secret_key_here"

redis:
  address: "your_production_server_ip:6379"
  password: "your_secure_redis_password_here"
  db: 0

kafka:
  enabled: true
  brokers:
    - "your_production_server_ip:9092"  # External IP for clients
  topic_prefix: "metrics"
  compression: "snappy"
  max_attempts: 3
  batch_size: 50  # Production: efficient batching
  required_acks: 1
  linger_ms: 1000  # Production: wait up to 1s for batch

metrics:
  cpu_temperature: true
  containers: true
  interval: "30s"

logging:
  level: "warn"  # Production: reduced logging
  file: "/var/log/servereye/agent.log"

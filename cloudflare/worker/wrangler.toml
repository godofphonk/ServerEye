name = "servereye-registration-worker"
main = "src/worker.ts"
compatibility_date = "2025-12-13"
compatibility_flags = ["nodejs_compat"]

# Bind the Cloudflare D1 database (update database_id after creation)
[[d1_databases]]
binding = "REG_DB"
database_name = "servereye-registration"
database_id = "9267400b-1d0b-4a66-a8a3-294168ff11dd"
migrations_dir = "migrations"

[vars]
# Optional shared secret to authenticate installer requests
# Set with: wrangler secret put INSTALLER_KEY
# INSTALLER_KEY = "your-secret-key"

# Webhook configuration for instant sync
# Set with: wrangler secret put WEBHOOK_URL and WEBHOOK_SECRET
# WEBHOOK_URL = "https://your-tunnel-url.internal/register-key"
# WEBHOOK_SECRET = "your-webhook-secret"

# ServerEye Agent CI Pipeline

name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build and Test Agent
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        run: go mod download
      
      - name: Build agent
        run: go build -v ./cmd/agent
      
      - name: Run unit tests
        run: |
          echo "🧪 Running agent tests..."
          rm -f coverage.txt
          go test -short -race -coverprofile=coverage.txt -covermode=atomic ./...
      
      - name: Show detailed coverage
        run: |
          echo "📊 Coverage Report by Module:"
          echo "=============================="
          go tool cover -func=coverage.txt | grep -E "internal/agent|^total:" || true
          echo ""
          echo "📈 Total Coverage:"
          go tool cover -func=coverage.txt | grep "^total:" || echo "Coverage report generated"
      
      - name: Check coverage threshold
        continue-on-error: true
        run: |
          COVERAGE=$(go tool cover -func=coverage.txt | grep "^total:" | awk '{print $3}' | sed 's/%//' || echo "0")
          echo "Current coverage: ${COVERAGE}%"
          THRESHOLD=40
          RESULT=$(awk -v cov="$COVERAGE" -v thr="$THRESHOLD" 'BEGIN { print (cov >= thr) ? "OK" : "FAIL" }')
          if [ "$RESULT" = "FAIL" ]; then
            echo "⚠️  Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold (warning only)"
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold"
          fi
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.txt
          fail_ci_if_error: false

  module-tests:
    name: Module Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        module:
          - internal/agent
          - internal/config
          - internal/version
          - pkg/metrics
          - pkg/docker
          - pkg/websocket
          - pkg/commands
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      
      - name: Test ${{ matrix.module }}
        run: |
          echo "🧪 Testing ${{ matrix.module }}..."
          go test -v -short -cover ./${{ matrix.module }}/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.7.2
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      
      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "🔒 Running security scan..."
          gosec -fmt=text ./... || echo "⚠️ Security issues found (non-blocking)"

  vulnerability-check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      
      - name: Download dependencies
        run: go mod download
      
      - name: Check for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      
      - name: Check for outdated dependencies
        continue-on-error: true
        run: |
          echo "📦 Checking dependencies..."
          go list -u -m all
